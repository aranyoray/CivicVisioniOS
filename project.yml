# XcodeGen spec — an alternate way to (re)generate CivicVision.xcodeproj.
# The committed CivicVision.xcodeproj already opens and builds in Xcode as-is;
# this file is only needed if you prefer to regenerate the project:
#
#   brew install xcodegen && xcodegen generate
#
name: CivicVision
options:
  bundleIdPrefix: lol.raviraj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  CivicVision:
    type: application
    platform: iOS
    sources:
      - path: CivicVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.raviraj.civicvision
        PRODUCT_NAME: CivicVision
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: CivicVision
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CivicVision uses your location to show air, water, and community-health data for your area. You can also search for a ZIP or place instead."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
